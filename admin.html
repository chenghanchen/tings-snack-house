<!doctype html>
<script defer src="admin-order-controls.js?v=20260820c"></script>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>婷婷的零食屋｜店主后台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css?v=20260820b"><link rel="stylesheet" href="order-cards.css?v=20260819b"><link rel="stylesheet" href="order-tab.css?v=20260820a"><link rel="stylesheet" href="marketing-wizard.css?v=20260820a"><link rel="stylesheet" href="shop-status.css?v=20260820a"></head>
<body><aside><a class="admin-brand" href="index.html"><span>婷婷</span><small>Ting’s Snack House</small></a><nav><button class="active" data-view="orders">订单中心 <b id="orderBadge">0</b></button><button data-view="products">商品管理</button><button data-view="categories">分类管理</button><button data-view="marketing">营销中心</button><button data-view="settings">店铺信息</button></nav><a class="visit" href="index.html">↗ 查看顾客网站</a></aside>
<main><header><div><p class="eyebrow">OWNER DASHBOARD</p><h1 id="pageTitle">订单中心</h1></div><div class="shop-status-switch" id="shopStatusSwitch" aria-label="店铺接单状态"><button class="shop-status-option active" type="button" data-shop-status="accepting"><i></i>正在接单</button><button class="shop-status-option" type="button" data-shop-status="paused">暂停接单</button></div></header>
<section class="view active" id="orders"><div class="stats"><div><span>当前订单</span><b id="allOrders">0</b></div><div><span>待确认</span><b id="newOrders">0</b></div><div><span>当前订单金额</span><b id="todayAmount">$0.00</b></div></div><div class="panel"><div class="panel-head"><div class="order-tab-heading"><h2 id="ordersTitle" class="sr-only">当前订单</h2><div class="order-tabs" role="tablist" aria-label="订单类型"><button class="order-tab active-order-tab" data-order-tab="current" role="tab" aria-selected="true">当前订单</button><button class="order-tab" data-order-tab="history" role="tab" aria-selected="false">历史订单</button></div></div></div><div class="order-search"><input id="orderSearch" placeholder="按日期、姓名、电话或订单号查找订单"></div><div id="ordersList" class="orders-list"></div></div></section>
<section class="view" id="products"><div class="panel"><div class="panel-head"><h2>商品列表</h2><button class="primary" id="newProduct">+ 添加商品</button></div><div id="productsList" class="products-list"></div></div></section>
<section class="view" id="categories"><div class="panel narrow"><h2>商品分类</h2><p class="muted">分类会自动显示在顾客网站的筛选栏中。</p><form class="inline-form" id="categoryForm"><input id="categoryName" required placeholder="例如：辣味零食"><button class="primary">添加分类</button></form><div id="categoryList" class="category-list"></div></div></section>
<section class="view" id="marketing"><div id="marketingCenter"></div></section>
<section class="view" id="settings"><div class="panel narrow"><h2>店铺与网页内容</h2><p class="muted">保存后顾客网站自动同步。</p><form id="settingsForm"><label>店铺中文名<input id="shopName" required></label><label>店铺英文名<input id="shopEnglish" required></label><label>配送说明<textarea id="deliveryText" rows="3"></textarea></label><div class="two"><label>固定配送费（美元）<input id="deliveryFeeInput" type="number" min="0" step="0.01"></label><label>免配送门槛（商品小计）<input id="freeDeliveryInput" type="number" min="0" step="0.01"></label></div><div class="two"><label>税率（%）<input id="taxRateInput" type="number" min="0" step="0.001"></label><label>低库存提醒阈值<input id="lowStockInput" type="number" min="0" step="1"></label></div><hr><section id="heroContentSettings"><h3>首页插画文案</h3><label>顶部小字<input id="heroEyebrowInput"></label><label>主标题第一行<input id="heroTitleInput"></label><label>主标题强调行<input id="heroEmphasisInput"></label><label>介绍文案<textarea id="heroIntroInput" rows="4"></textarea></label><label>按钮文字<input id="heroButtonInput"></label></section><hr><section id="footerContentSettings"><h3>页尾文案</h3><label>页尾营业时间<input id="footerHoursInput"></label><label>页尾年份<input id="footerYearInput" inputmode="numeric" maxlength="4"></label></section><button class="primary">保存店铺设置</button></form></div></section>
</main>
<dialog id="pauseOrdersDialog" class="pause-orders-dialog" aria-labelledby="pauseOrdersTitle"><button class="close" id="closePauseOrders" type="button" aria-label="关闭">×</button><p class="eyebrow">ORDER AVAILABILITY</p><h2 id="pauseOrdersTitle">暂停接单</h2><p class="muted">选择恢复接单的具体日期和时间；留空则会持续暂停，直到您手动恢复接单。</p><label>恢复接单日期与时间（选填）<input id="pauseUntilInput" type="datetime-local"></label><div class="pause-dialog-actions"><button class="text-btn" id="cancelPauseOrders" type="button">暂不暂停</button><button class="primary" id="confirmPauseOrders" type="button">确认暂停接单</button></div></dialog>
<dialog id="productDialog"><button class="close" id="closeProduct">×</button><p class="eyebrow">PRODUCT DETAILS</p><h2 id="productDialogTitle">添加商品</h2><form id="productForm"><input type="hidden" id="productId"><label>商品名称<input id="productName" required></label><label>商品简介<input id="productNote" required></label><div class="two"><label>分类<select id="productType"></select></label><label>基础价格（无规格时）<input id="productPrice" type="number" min="0" step="0.01" required></label></div><div class="two"><label>基础库存<input id="productStock" type="number" min="0" step="1" value="100"></label><label>基础缺货<select id="productOut"><option value="false">可售</option><option value="true">缺货</option></select></label></div><div class="two"><label>展示表情<input id="productIcon" value="🍪" maxlength="4"></label><label>背景颜色<input id="productColor" type="color" value="#e5c68d"></label></div><label>上传商品主图片<input id="productImage" type="file" accept="image/*"></label><div id="imagePreview" class="image-preview">🍪</div><hr><div class="panel-head"><h3>规格组（可拖拽排序）</h3><button class="text-btn" type="button" id="addSpecGroup">+ 添加规格组</button></div><div id="specGroups"></div><div id="variantsEditor"></div><button class="primary save" type="submit">保存商品与规格</button></form></dialog><div id="toast" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js?v=20260809g"></script><script src="marketing.js?v=20260820a"></script></body></html>
