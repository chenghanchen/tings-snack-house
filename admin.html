<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>婷婷的零食屋｜店主后台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body><aside><a class="admin-brand" href="index.html"><span>婷婷</span><small>Ting’s Snack House</small></a><nav><button class="active" data-view="orders">订单中心 <b id="orderBadge">0</b></button><button data-view="products">商品管理</button><button data-view="categories">分类管理</button><button data-view="settings">店铺信息</button></nav><a class="visit" href="index.html">↗ 查看顾客网站</a></aside>
<main><header><div><p class="eyebrow">OWNER DASHBOARD</p><h1 id="pageTitle">订单中心</h1></div><div class="live"><i></i> 正在接收订单</div></header>
<section class="view active" id="orders"><div class="stats"><div><span>全部订单</span><b id="allOrders">0</b></div><div><span>待处理订单</span><b id="newOrders">0</b></div><div><span>今日预订金额</span><b id="todayAmount">$0.00</b></div></div><div class="panel"><div class="panel-head"><h2>最新订单</h2><button class="text-btn" id="clearOrders">清空订单</button></div><div id="ordersList" class="orders-list"></div></div></section>
<section class="view" id="products"><div class="panel"><div class="panel-head"><h2>商品列表</h2><button class="primary" id="newProduct">+ 添加商品</button></div><div id="productsList" class="products-list"></div></div></section>
<section class="view" id="categories"><div class="panel narrow"><h2>商品分类</h2><p class="muted">分类会自动显示在顾客网站的筛选栏中。</p><form class="inline-form" id="categoryForm"><input id="categoryName" required placeholder="例如：辣味零食"><button class="primary">添加分类</button></form><div id="categoryList" class="category-list"></div></div></section>
<section class="view" id="settings"><div class="panel narrow"><h2>店铺与网页内容</h2><p class="muted">保存后，顾客网站会自动更新。可修改首页文案、插画卡片文字与页尾内容。</p><form id="settingsForm"><label>店铺中文名<input id="shopName" required></label><label>店铺英文名<input id="shopEnglish" required></label><label>配送说明<textarea id="deliveryText" rows="4"></textarea></label><hr><h3>首页开头</h3><label>顶部小字<input id="heroEyebrowInput"></label><label>主标题第一行<input id="heroTitleInput"></label><label>主标题强调行<input id="heroEmphasisInput"></label><label>介绍文案<textarea id="heroIntroInput" rows="4"></textarea></label><label>按钮文字<input id="heroButtonInput"></label><div class="two"><label>插画卡片一图案<input id="heroCardOneIconInput" maxlength="4" placeholder="米"></label><label>插画卡片一文字<input id="heroCardOneTextInput" placeholder="锅巴"></label></div><div class="two"><label>插画卡片二图案<input id="heroCardTwoIconInput" maxlength="4" placeholder="桃"></label><label>插画卡片二文字<input id="heroCardTwoTextInput" placeholder="果干"></label></div><div class="two"><label>插画徽章上字<input id="heroBadgeTopInput"></label><label>插画徽章下字<input id="heroBadgeBottomInput"></label></div><hr><h3>网页末尾</h3><label>故事图案／店铺印章<input id="storyMarkInput" placeholder="小町"></label><label>故事上方小字<input id="storyEyebrowInput"></label><label>故事标题第一行<input id="storyTitleInput"></label><label>故事标题第二行<input id="storySubtitleInput"></label><label>故事文案<textarea id="storyTextInput" rows="4"></textarea></label><label>落款文案<input id="storySignatureInput"></label><label>页尾营业时间<input id="footerHoursInput"></label><label>页尾年份<input id="footerYearInput" inputmode="numeric" maxlength="4"></label><button class="primary">保存网页内容</button></form></div></section>
</main>
<dialog id="productDialog"><button class="close" id="closeProduct">×</button><p class="eyebrow">PRODUCT DETAILS</p><h2 id="productDialogTitle">添加商品</h2><form id="productForm"><input type="hidden" id="productId"><label>商品名称<input id="productName" required></label><label>商品简介<input id="productNote" required></label><div class="two"><label>分类<select id="productType"></select></label><label>价格（美元）<input id="productPrice" type="number" min="0" step="0.01" required></label></div><div class="two"><label>展示表情<input id="productIcon" value="🍪" maxlength="4"></label><label>背景颜色<input id="productColor" type="color" value="#e5c68d"></label></div><label>上传食物图片 <input id="productImage" type="file" accept="image/*"><small>可选；上传后会替换表情展示。</small></label><div id="imagePreview" class="image-preview">🍪</div><button class="primary save" type="submit">保存商品</button></form></dialog><div id="toast" role="status"></div><script src="admin.js"></script></body></html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
