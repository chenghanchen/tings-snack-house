name: Release checks

on:
  pull_request:
  push:
    branches: [main, fix/media-guard-body-limits-locks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Initialize version-bound report
        run: node scripts/release-report.mjs init --version HEAD
      - name: Check release checkout
        run: node scripts/release-report.mjs check --version HEAD --gate workingTree
      - name: Install test dependencies
        if: always()
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run release checks
        if: always()
        run: node scripts/release-report.mjs check --version HEAD --gate tests
      - name: Run mandatory PGlite database tests
        if: always()
        run: node scripts/release-report.mjs check --version HEAD --gate database
      - name: Scan source for secrets
        if: always()
        run: node scripts/release-report.mjs check --version HEAD --gate security
      - name: Generate preflight report (not production success)
        if: always()
        run: node scripts/release-report.mjs render --version HEAD
      - name: Upload report and check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ github.sha }}
          path: .build/releases/${{ github.sha }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  edge-bundler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/edge-bundle-proof.test.mjs
      - run: node scripts/release-security.mjs
      - run: node scripts/edge-bundle-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-lockfile-proof-${{ github.sha }}
          path: .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  media-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-media-concurrency.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-concurrency-${{ github.sha }}
          path: .build/media-concurrency/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
