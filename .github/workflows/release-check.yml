name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA (missing or unreadable fails closed)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Single required check, same GitHub Actions App. CI edits require human review.
  # No classifier, bootstrap, API verdict, report, approval state or deployment.
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install offline Chromium
        run: npx --no-install playwright install --with-deps chromium
      # Installing a small toolchain is unconditional; Edge/Docker checks are not.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Base and selected safety checks
        run: node scripts/ci-check.mjs all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/ci/
            .build/browser-baseline/
            .build/media-concurrency/
            .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
