name: Verify production release

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Full previous deployed release SHA (not HEAD^ unless that is the full release range)'
        required: true
        type: string

env:
  RELEASE_BASE_SHA: ${{ inputs.base }}

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-verification
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: level
        shell: bash
        run: |
          # Never let a candidate classifier lower its own review requirements.
          level=L3
          policy="$RUNNER_TEMP/trusted-release-level.mjs"
          if [[ "$RELEASE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$RELEASE_BASE_SHA" HEAD && git show "$RELEASE_BASE_SHA:scripts/release-level.mjs" > "$policy" 2>/dev/null; then
            result=$(node "$policy" --root "$GITHUB_WORKSPACE" --base "$RELEASE_BASE_SHA" --head HEAD --format level) || result=L3
            case "$result" in L1|L2|L3) level="$result" ;; *) level=L3 ;; esac
          fi
          echo "Trusted base policy gate floor: $level"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "RELEASE_GATE_FLOOR=$level" >> "$GITHUB_ENV"
      - uses: denoland/setup-deno@v2
        if: ${{ steps.level.outputs.level != 'L1' && steps.level.outputs.level != 'L2' }}
        with:
          deno-version: v2.9.6
      - run: node scripts/release-report.mjs init --version HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify every gate and persist actual evidence
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          failed=0
          for gate in workingTree tests database security github frozenVersion edgeBundler productionApproval cloudflare supabase productionMatch desktop mobile guestCheckout production; do
            node scripts/release-report.mjs check --version HEAD --gate "$gate" || failed=1
          done
          exit "$failed"
      - name: Finalize actual result and history (including incomplete or failed)
        if: always()
        run: node scripts/release-report.mjs finalize --version HEAD
      - name: Publish job summary
        if: always()
        run: node scripts/release-report.mjs render --version HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-${{ github.sha }}
          path: |
            .build/releases/${{ github.sha }}/
            RELEASE-HISTORY.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
