name: Verify production release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-verification
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-report.mjs init --version HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify every gate and persist actual evidence
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          failed=0
          for gate in workingTree tests database security github cloudflare supabase desktop mobile guestCheckout production; do
            node scripts/release-report.mjs check --version HEAD --gate "$gate" || failed=1
          done
          exit "$failed"
      - name: Finalize actual result and history (including incomplete or failed)
        if: always()
        run: node scripts/release-report.mjs finalize --version HEAD
      - name: Publish job summary
        if: always()
        run: node scripts/release-report.mjs render --version HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-${{ github.sha }}
          path: |
            .build/releases/${{ github.sha }}/
            RELEASE-HISTORY.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
