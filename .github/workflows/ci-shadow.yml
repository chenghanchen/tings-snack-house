name: Minimal CI shadow

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Full base SHA (missing/invalid selects all and fails gate)
        type: string
        required: true

permissions:
  contents: read

env:
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
  # Intentionally unset until a human approves and explicitly pins the full SHA.
  BOOTSTRAP_TRUST_ANCHOR_SHA: ''

jobs:
  select:
    name: shadow-select
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      database: ${{ steps.select.outputs.database }}
      edge: ${{ steps.select.outputs.edge }}
      mediaConcurrency: ${{ steps.select.outputs.mediaConcurrency }}
      checkout_sha: ${{ steps.proof.outputs.sha }}
      checkout_run_id: ${{ steps.proof.outputs.run_id }}
      checkout_run_attempt: ${{ steps.proof.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: proof
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$GITHUB_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: select
        run: node scripts/ci-trusted-launcher.mjs select

  test:
    name: shadow-test
    needs: select
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.check.outputs.cases }}
      checkout_sha: ${{ steps.check.outputs.checkout_sha }}
      checkout_run_id: ${{ steps.check.outputs.checkout_run_id }}
      checkout_run_attempt: ${{ steps.check.outputs.checkout_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - id: check
        run: node scripts/ci-check.mjs base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .build/ci-shadow/
            .build/browser-baseline/
            .build/media-concurrency/
            .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: error

  database:
    name: shadow-database
    needs: select
    if: ${{ always() && (needs.select.result != 'success' || needs.select.outputs.database != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.check.outputs.cases }}
      checkout_sha: ${{ steps.check.outputs.checkout_sha }}
      checkout_run_id: ${{ steps.check.outputs.checkout_run_id }}
      checkout_run_attempt: ${{ steps.check.outputs.checkout_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        run: node scripts/ci-check.mjs database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-database-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .build/ci-shadow/
            .build/browser-baseline/
            .build/media-concurrency/
            .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: error

  edge:
    name: shadow-edge
    needs: select
    if: ${{ always() && (needs.select.result != 'success' || needs.select.outputs.edge != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      cases: ${{ steps.check.outputs.cases }}
      checkout_sha: ${{ steps.check.outputs.checkout_sha }}
      checkout_run_id: ${{ steps.check.outputs.checkout_run_id }}
      checkout_run_attempt: ${{ steps.check.outputs.checkout_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - id: check
        run: node scripts/ci-check.mjs edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-edge-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .build/ci-shadow/
            .build/browser-baseline/
            .build/media-concurrency/
            .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: error

  media-concurrency:
    name: shadow-media-concurrency
    needs: select
    if: ${{ always() && (needs.select.result != 'success' || needs.select.outputs.mediaConcurrency != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cases: ${{ steps.check.outputs.cases }}
      checkout_sha: ${{ steps.check.outputs.checkout_sha }}
      checkout_run_id: ${{ steps.check.outputs.checkout_run_id }}
      checkout_run_attempt: ${{ steps.check.outputs.checkout_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        run: node scripts/ci-check.mjs media-concurrency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-media-concurrency-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .build/ci-shadow/
            .build/browser-baseline/
            .build/media-concurrency/
            .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: error

  release-gate-shadow:
    name: release-gate-shadow
    needs: [select, test, database, edge, media-concurrency]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/ci-select.test.mjs tests/ci-shadow-gate.test.mjs tests/ci-check.test.mjs tests/cache-version-guard.test.mjs
      - name: Evaluate current attempt only
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SHADOW_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-trusted-launcher.mjs gate
