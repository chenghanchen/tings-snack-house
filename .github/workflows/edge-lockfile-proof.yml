name: Edge lockfile Docker proof (no deployment)
on:
  push:
    branches: ['audit/edge-lockfile-bundling-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-proof:
    if: startsWith(github.ref, 'refs/heads/audit/edge-lockfile-bundling-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/edge-bundle-proof.test.mjs
      - run: node scripts/release-security.mjs
      - name: Real Docker bundling and integrity rejection
        run: node scripts/edge-bundle-proof.mjs
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-lockfile-proof-${{ github.sha }}
          path: .build/edge-bundle-proof/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
